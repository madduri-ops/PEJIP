[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pejip"
version = "0.1.0"
description = "Personal Executive Job Intelligence Platform: finds, ranks and explains senior-leadership roles."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "anthropic==1.11.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.1.3",
]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "build==1.3.0",
    "mypy==2.4.0",
    "pip-audit==2.9.0",
    "pre-commit==4.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.10",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
pejip = "pejip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pejip = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL", "C90"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "PLR0915", "PLC0415"]
"scripts/**" = ["S603"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
strict = true
packages = ["pejip"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises several components together with stubbed I/O",
    "system: runs the installed CLI end to end against local stub servers",
]

[tool.coverage.run]
branch = true
source = ["pejip"]

[tool.coverage.report]
show_missing = true
skip_covered = true
