# PEJIP search configuration (spec sections 3, 4, 6, 9). Editing this file changes
# what is searched and how it is scored without a code change. Every value that
# affects ranking is versioned through `scoring.version`; bump it when weights or
# thresholds change so stored recommendations stay traceable.

sources:
  # Company boards on public ATS APIs. Only sources listed in docs/sources.md may
  # appear here. `board` is the company's public board token.
  # Babu's targets are Google, NVIDIA, Meta, Micron, Anthropic, OpenAI and
  # Microsoft. Only Anthropic publishes its roles through an allowed public API;
  # the others run their own or Workday career sites with no public API, and
  # OpenAI's Ashby feed lists only a few of its roles (checked 2026-10-05).
  - {adapter: greenhouse, company: Anthropic, board: anthropic}
  # Bay Area companies on public Greenhouse boards, added for testing at Babu's
  # request (2026-10-05); boards checked the same day.
  - {adapter: greenhouse, company: Stripe, board: stripe}
  - {adapter: greenhouse, company: Databricks, board: databricks}
  - {adapter: greenhouse, company: Airbnb, board: airbnb}
  - {adapter: greenhouse, company: Figma, board: figma}
  - {adapter: greenhouse, company: Dropbox, board: dropbox}
  - {adapter: greenhouse, company: Pinterest, board: pinterest}
  - {adapter: greenhouse, company: Instacart, board: instacart}
  - {adapter: greenhouse, company: Robinhood, board: robinhood}
  - {adapter: greenhouse, company: Scale AI, board: scaleai}

inbox:
  # Job-alert emails Babu signed up for with alerts@inbox.job-search.zephyr-mcg.com
  # (design doc 0010). A link in an alert becomes a role only when it points at one
  # of these careers pages (host/path prefix; subdomains match). The linked pages
  # are not fetched. Patterns are the sites' public job URLs as of 2026-10-05;
  # adjust them if an alert's links point elsewhere.
  companies:
    - {company: Google, link_patterns: [careers.google.com/, www.google.com/about/careers]}
    - {company: NVIDIA, link_patterns: [nvidia.wd5.myworkdayjobs.com/]}
    - {company: Meta, link_patterns: [metacareers.com/]}
    - {company: Micron, link_patterns: [careers.micron.com/, jobs.micron.com/, micron.eightfold.ai/]}
    - {company: OpenAI, link_patterns: [openai.com/careers, jobs.ashbyhq.com/openai]}
    - {company: Microsoft, link_patterns: [careers.microsoft.com/]}
    # LinkedIn job alerts, auto-forwarded from Babu's Yahoo mailbox. LinkedIn is a
    # job board: the employer and location come from the text under each role.
    - company: LinkedIn
      job_board: true
      link_patterns: [linkedin.com/jobs/view, linkedin.com/comm/jobs/view]
      job_id_pattern: 'jobs/view/\d+'

network:
  # Other employer names LinkedIn profiles use for a tracked company (spec 13.3).
  # Matching is exact after removing case, punctuation and suffixes such as Inc.;
  # anything less certain waits for Babu's review instead of guessing.
  company_aliases:
    Google: [Alphabet, Google LLC]
    Meta: [Facebook, Meta Platforms]
    Micron: [Micron Technology]
    Microsoft: [Microsoft Corporation]
    NVIDIA: [Nvidia Corporation]

fetch:
  user_agent: "PEJIP/0.1 (personal job research; +https://github.com/madduri-ops/PEJIP)"
  min_interval_seconds: 1.0      # per source host
  max_retries: 3
  backoff_base_seconds: 2.0
  timeout_seconds: 30.0

taxonomy:
  # Title seniority patterns, matched after normalizing VP / V.P. / Sr. variants
  # (spec 3.2, 3.3).
  seniority_patterns:
    - vice president
    - head of
    - senior director
    - executive director
    - chief
  excluded_title_patterns:
    - assistant vice president
    - associate director
    - intern
  # Role-family terms (spec 3.1). A title needs a seniority pattern and one of these.
  role_terms:
    - operations
    - transformation
    - program
    - portfolio
    - strategic
    - strategy
    - platform
    - productivity
    - technology
    - engineering
    - enterprise
    - digital
    - cloud
    - ai
    - governance

geography:
  hard_filter: true             # drop roles outside every scope below (spec 4.7)
  scopes:
    BAY_AREA:
      preference: PREFERRED
      places:
        - san francisco
        - bay area
        - south san francisco
        - burlingame
        - san mateo
        - redwood city
        - menlo park
        - palo alto
        - mountain view
        - sunnyvale
        - santa clara
        - san jose
        - cupertino
        - fremont
        - newark
        - milpitas
        - hayward
        - oakland
        - pleasanton
        - san ramon
    US_REMOTE:
      preference: ACCEPTABLE
      places: []

ai:
  model: claude-opus-5-5
  effort: medium
  max_tokens: 16000
  max_jobs_per_run: 40
  # The $100 monthly cap, spend alerts and prices live in the cost guard
  # (src/pejip/cost/); the model must have an entry in its pricing.json.

scoring:
  version: fit-2
  # Fit component weights (spec 9.7). Starting parameters, tuned on the golden set.
  fit_weights:
    ROLE_RESPONSIBILITY: 25
    SENIORITY_SCOPE: 20
    CAPABILITY: 20
    LEADERSHIP: 15
    CAREER_DIRECTION: 15
    DOMAIN_INDUSTRY: 5
  negative_signal_penalty: 8     # Fit points per distinct negative-fit signal
  core_gap_penalty: 10           # Fit points per CORE, REQUIRED requirement with NO_MATCH
  confidence_thresholds: {HIGH: 0.75, MEDIUM: 0.5}
  priority_weights:
    FIT: 70
    FRESHNESS: 10
    COMPENSATION: 10
    LOCATION: 10
  priority_thresholds: {IMMEDIATE: 85, HIGH: 72, MEDIUM: 55}
  priority_min_fit: {IMMEDIATE: 85, HIGH: 75}   # a band also needs this much Fit
  immediate_max_age_days: 3
  strong_match_fit: 75
  # Priority points from the network (design doc 0014): a matured connection at the
  # company, otherwise any first-degree connection there. Fit never changes, and the
  # priority_min_fit floors still apply, so a weak-fit role stays out of the top bands.
  network_priority_boost: {MATURED: 10, CONNECTED: 3}
  network_min_fit: 60            # below this Fit, connections add no Priority

retention_days: 90
