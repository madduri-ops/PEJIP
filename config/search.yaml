# PEJIP search configuration (spec sections 3, 4, 6, 9). Editing this file changes
# what is searched and how it is scored without a code change. Every value that
# affects ranking is versioned through `scoring.version`; bump it when weights or
# thresholds change so stored recommendations stay traceable.

sources:
  # Company boards on public ATS APIs. Only sources listed in docs/sources.md may
  # appear here. `board` is the company's public board token.
  # Babu's own target companies are not in this public file (ADR-0009): they are
  # added at run time from PEJIP_COMPANIES (a local file) or, on AWS, the
  # encrypted SSM parameter PEJIP_COMPANIES_PARAMETER names. The format is
  # examples/companies.example.yaml.
  # Bay Area companies on public Greenhouse boards, added for testing at Babu's
  # request (2026-10-05); boards checked the same day.
  - {adapter: greenhouse, company: Stripe, board: stripe}
  - {adapter: greenhouse, company: Databricks, board: databricks}
  - {adapter: greenhouse, company: Airbnb, board: airbnb}
  - {adapter: greenhouse, company: Figma, board: figma}
  - {adapter: greenhouse, company: Dropbox, board: dropbox}
  - {adapter: greenhouse, company: Pinterest, board: pinterest}
  - {adapter: greenhouse, company: Instacart, board: instacart}
  - {adapter: greenhouse, company: Robinhood, board: robinhood}
  - {adapter: greenhouse, company: Scale AI, board: scaleai}

inbox:
  # Job-alert emails sent to alerts@inbox.job-search.zephyr-mcg.com (design doc
  # 0010). A link in an alert becomes a role only when it points at one of these
  # careers pages (host/path prefix; subdomains match). The linked pages are not
  # fetched. The companies whose alerts Babu signed up for are in the private
  # company list (ADR-0009), not here.
  companies:
    # LinkedIn job alerts, auto-forwarded from Babu's Yahoo mailbox. LinkedIn is a
    # job board: the employer and location come from the text under each role.
    - company: LinkedIn
      job_board: true
      link_patterns: [linkedin.com/jobs/view, linkedin.com/comm/jobs/view]
      job_id_pattern: 'jobs/view/\d+'
    # Other job boards' alert emails (added 2026-10-06). Babu signs up for each with
    # his Yahoo address, which is auto-forwarded like LinkedIn's. Link patterns and role ids are
    # first guesses from each site's public job URLs; tune them on real alerts.
    # Indeed and Glassdoor have no role-id pattern: their ids sit in the query
    # string, and a link rebuilt from the id alone would not open.
    - company: Ladders
      job_board: true
      link_patterns: [theladders.com/job]
      job_id_pattern: 'job/[\w-]+'
    - company: Indeed
      job_board: true
      link_patterns: [indeed.com/rc/clk, indeed.com/viewjob, indeed.com/pagead/clk]
    - company: Glassdoor
      job_board: true
      link_patterns: [glassdoor.com/job-listing, glassdoor.com/partner/joblisting.htm]
    - company: Built In
      job_board: true
      link_patterns: [builtin.com/job]
      job_id_pattern: 'job/[\w-]+/\d+'
    - company: Wellfound
      job_board: true
      link_patterns: [wellfound.com/jobs]
      job_id_pattern: 'jobs/\d+'

fetch:
  user_agent: "PEJIP/0.1 (personal job research; +https://github.com/madduri-ops/PEJIP)"
  min_interval_seconds: 1.0      # per source host
  max_retries: 3
  backoff_base_seconds: 2.0
  timeout_seconds: 30.0

taxonomy:
  # Title seniority patterns, matched after normalizing VP / V.P. / Sr. variants
  # (spec 3.2, 3.3).
  seniority_patterns:
    - vice president
    - head of
    - senior director
    - executive director
    - chief
  excluded_title_patterns:
    - assistant vice president
    - associate director
    - intern
  # Role-family terms (spec 3.1). A title needs a seniority pattern and one of these.
  role_terms:
    - operations
    - transformation
    - program
    - portfolio
    - strategic
    - strategy
    - platform
    - productivity
    - technology
    - engineering
    - enterprise
    - digital
    - cloud
    - ai
    - governance
    # Added 2026-10-06 from Babu's resumes: privacy, identity, security and
    # mobile depth, IT and infrastructure, product, M&A and chief of staff roles.
    - privacy
    - identity
    - security
    - cybersecurity
    - trust
    - risk
    - compliance
    - mobile
    - infrastructure
    - information technology
    - it
    - developer
    - product
    - delivery
    - m&a
    - integration
    - chief of staff

geography:
  hard_filter: true             # drop roles outside every scope below (spec 4.7)
  scopes:
    BAY_AREA:
      preference: PREFERRED
      places:
        - san francisco
        - bay area
        - south san francisco
        - burlingame
        - san mateo
        - redwood city
        - menlo park
        - palo alto
        - mountain view
        - sunnyvale
        - santa clara
        - san jose
        - cupertino
        - fremont
        - newark
        - milpitas
        - hayward
        - oakland
        - pleasanton
        - san ramon
    US_REMOTE:
      preference: ACCEPTABLE
      places: []

ai:
  model: claude-opus-5-5
  effort: medium
  max_tokens: 16000
  max_jobs_per_run: 40
  # The $100 monthly cap, spend alerts and prices live in the cost guard
  # (src/pejip/cost/); the model must have an entry in its pricing.json.

scoring:
  version: fit-2
  # Fit component weights (spec 9.7). Starting parameters, tuned on the golden set.
  fit_weights:
    ROLE_RESPONSIBILITY: 25
    SENIORITY_SCOPE: 20
    CAPABILITY: 20
    LEADERSHIP: 15
    CAREER_DIRECTION: 15
    DOMAIN_INDUSTRY: 5
  negative_signal_penalty: 8     # Fit points per distinct negative-fit signal
  core_gap_penalty: 10           # Fit points per CORE, REQUIRED requirement with NO_MATCH
  confidence_thresholds: {HIGH: 0.75, MEDIUM: 0.5}
  priority_weights:
    FIT: 70
    FRESHNESS: 10
    COMPENSATION: 10
    LOCATION: 10
  priority_thresholds: {IMMEDIATE: 85, HIGH: 72, MEDIUM: 55}
  priority_min_fit: {IMMEDIATE: 85, HIGH: 75}   # a band also needs this much Fit
  immediate_max_age_days: 3
  strong_match_fit: 75
  # Priority points from the network (design doc 0014): a matured connection at the
  # company, otherwise any first-degree connection there. Fit never changes, and the
  # priority_min_fit floors still apply, so a weak-fit role stays out of the top bands.
  network_priority_boost: {MATURED: 10, CONNECTED: 3}
  network_min_fit: 60            # below this Fit, connections add no Priority

retention_days: 90
