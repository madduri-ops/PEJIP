# Fast local checks before each commit. CI runs the same hooks.
# Add each language's lint and format hooks when that language is introduced
# (see docs/BUILD_POLICY.md, section 9).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  # Needs terraform and tflint on PATH (see CONTRIBUTING.md).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args: ['--args=--config=__GIT_WORKING_DIR__/infra/.tflint.hcl']
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--select, 'E,F,W,I,B,UP,SIM,RUF,PT,PL,C4,RET,BLE', --ignore, 'PLR2004,PLR0913']
        files: ^(src/pejip_eval|tests/eval)/
      - id: ruff-format
        files: ^(src/pejip_eval|tests/eval)/
