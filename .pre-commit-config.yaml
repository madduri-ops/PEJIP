# Fast local checks before each commit. CI runs the same hooks.
# Add each language's lint and format hooks when that language is introduced
# (see docs/BUILD_POLICY.md, section 9).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Needs terraform and tflint on PATH (see CONTRIBUTING.md).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args: ['--args=--config=__GIT_WORKING_DIR__/infra/.tflint.hcl']
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  # Runs in Docker, so it needs Docker locally (see CONTRIBUTING.md).
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
  # Uses the mypy from `pip install -e '.[dev]'` so it sees the app's dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      # CHANGELOG.md sections and the pyproject.toml version agree (policy section 15).
      - id: release-check
        name: changelog and version agree
        entry: python -m ci.release check
        language: system
        files: ^(CHANGELOG\.md|pyproject\.toml|ci/release\.py)$
        pass_filenames: false
