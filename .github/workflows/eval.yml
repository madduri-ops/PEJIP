# Golden evaluation set and harness (docs/BUILD_POLICY.md sections 1-4 and 12,
# docs/design/0003-golden-evaluation-set.md).
# Stages: lint, then unit tests at 100% line and branch coverage plus the golden-set
# check, then dependency audit. Every gate fails the build.
#
# When the scoring pipeline lands, its paths join the trigger list and a step runs
# `python -m pejip_eval run --scorer <its scorer>` so any change to prompts, models,
# ranking logic or weights must hold the committed baseline (eval/baseline.json).
name: Eval

on:
  pull_request:
    paths: ['eval/**', 'src/pejip_eval/**', 'tests/eval/**', '.github/workflows/eval.yml']
  push:
    branches: [main]
    paths: ['eval/**', 'src/pejip_eval/**', 'tests/eval/**', '.github/workflows/eval.yml']

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: src
  RUFF_ARGS: --select E,F,W,I,B,UP,SIM,RUF,PT,PL,C4,RET,BLE --ignore PLR2004,PLR0913

jobs:
  lint:
    name: Eval lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r eval/requirements-dev.txt
      - run: ruff check $RUFF_ARGS src/pejip_eval tests/eval
      - run: ruff format --check src/pejip_eval tests/eval

  test:
    name: Eval tests and golden set
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r eval/requirements-dev.txt
      - run: python -m pejip_eval validate
      - run: >-
          python -m pytest tests/eval -q
          --cov=pejip_eval --cov-branch --cov-fail-under=100
          --cov-report=term-missing --cov-report=xml:eval-coverage.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-coverage
          path: eval-coverage.xml

  audit:
    name: Eval dependency audit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r eval/requirements-dev.txt
      - run: pip-audit -r eval/requirements-dev.txt --strict
