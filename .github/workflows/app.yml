# Application CI for the Python package (docs/BUILD_POLICY.md sections 1-4, 12).
# Stages: lint, then unit tests, then integration (with the coverage gate),
# system, SAST, dependency audit and the evaluation set in parallel.
# Every gate fails the build; nothing here may be made non-blocking.
# DAST and the API smoke test join this workflow with the first HTTP endpoint;
# the app has no network surface yet.
name: App

on:
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'src/pejip/prompts/**'
      - '!infra/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'src/pejip/prompts/**'
      - '!infra/**'

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Terraform hooks run in the Infra workflow, which installs Terraform.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: terraform_fmt,terraform_tflint
      - run: mypy

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  integration:
    name: Integration tests and coverage gate
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m "not system" -q --cov --cov-branch --cov-report=json --cov-report=html:reports/coverage
      - run: python scripts/check_coverage.py coverage.json coverage-baseline.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: reports/coverage

  system:
    name: System tests and build-artifact check
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install build==1.3.0
      - run: python -m build --wheel
      - run: python scripts/check_artifact.py dist
      # Test the built wheel, not the source tree.
      - run: pip install dist/pejip-*.whl pytest==9.1.1 PyYAML==6.0.3
      - run: pytest -m system -q --junitxml=reports/system.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-report
          path: reports/system.xml

  sast:
    name: SAST
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit==1.9.4
      # Full report (all severities) is uploaded; high severity blocks.
      - run: bandit -r src -f json -o reports-bandit.json --exit-zero
      - run: bandit -r src --severity-level high
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sast-report
          path: reports-bandit.json

  dependency-audit:
    name: Dependency audit
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      # Audits every installed dependency of the app and its tooling. This blocks on
      # any known vulnerability, which is stricter than the policy's high/critical bar.
      - run: pip freeze --exclude-editable > requirements-audit.txt
      - run: pip-audit -r requirements-audit.txt --no-deps --desc

  eval:
    name: Evaluation set (replay)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - run: pejip eval

  eval-live:
    name: Evaluation set (live model)
    needs: unit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        name: Detect prompt, model or AI changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(src/pejip/prompts/|src/pejip/ai/|src/pejip/analysis\.py|config/search\.yaml|evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - if: steps.changes.outputs.run == 'true'
        run: pip install -e .
      # Calls the model, so it needs the ANTHROPIC_API_KEY repository secret and fails without it.
      - if: steps.changes.outputs.run == 'true'
        run: pejip eval --live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
