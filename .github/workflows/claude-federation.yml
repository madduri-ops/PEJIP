# Proves keyless Claude access works from GitHub Actions (ADR-0004,
# docs/design/0007-claude-identity-federation.md): pejip.claude_auth fetches the
# job's OIDC token, Anthropic swaps it for a short-lived Claude token, and the job
# lists models with it. Listing models is free, so this check costs nothing.
name: Claude federation

on:
  pull_request:
    paths:
      - 'src/pejip/claude_auth.py'
      - 'infra/claude_federation.tf'
      - '.github/workflows/claude-federation.yml'

concurrency:
  group: claude-federation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  verify:
    name: Claude federation check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PEJIP_CLAUDE_IDENTITY: github-actions
      # Not secrets: they name the Anthropic rule, and only this repository's pull
      # request runs match it (docs/design/0007-claude-identity-federation.md).
      ANTHROPIC_ORGANIZATION_ID: a477af3f-5a3d-4ce5-baf6-dce8ef60bcba
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01CtwDVHviL3ksZcu5qotT3G
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01Sv6EquQ5ayA76z1avc8P6e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - name: Exchange the GitHub OIDC token and list models
        run: |
          set -euo pipefail
          # Builds the same arguments the app passes to the Anthropic SDK; fails on
          # a missing or malformed ID before anything is sent.
          python - > request.json <<'PY'
          import base64, json, os
          from pejip.claude_auth import federation_credentials
          kwargs = federation_credentials(os.environ)
          jwt = kwargs["identity_token_provider"]()
          # Keep the claims the rule matches on (not the signed token) for the log.
          payload = jwt.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          keep = ("iss", "sub", "aud", "repository", "repository_id", "repository_owner",
                  "repository_owner_id", "event_name", "ref")
          with open("claims.json", "w") as f:
              json.dump({k: claims.get(k) for k in keep}, f)
          print(json.dumps({
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": jwt,
              "federation_rule_id": kwargs["federation_rule_id"],
              "organization_id": kwargs["organization_id"],
              "service_account_id": kwargs["service_account_id"],
          }))
          PY
          status=$(curl -sS -o exchange.json -w '%{http_code}' https://api.anthropic.com/v1/oauth/token \
            -H 'content-type: application/json' --data-binary @request.json)
          rm request.json
          if [ "$status" != 200 ]; then
            jq -c '.error // .' exchange.json
            echo "Identity token claims the rule is matched against:"
            jq . claims.json
            echo "::error::Token exchange returned $status. The deny reason is in the Claude Console under Settings > Workload identity > History."
            exit 1
          fi
          token=$(jq -r .access_token exchange.json)
          rm exchange.json
          echo "::add-mask::$token"
          count=$(curl -sSf https://api.anthropic.com/v1/models \
            -H "authorization: Bearer $token" -H 'anthropic-version: 2023-06-01' | jq '.data | length')
          echo "Keyless Claude access works: $count models visible to the CI service account."
