# Golden Evaluation Set manifest (spec 9.42, 17.31-17.34, policy section 12).
# Bump golden_set_version whenever a case, a label or the profile changes, and
# note why in eval/README.md's changelog.

golden_set_version = "1.1.0"
profile = "profile.toml"
cases_dir = "cases"
labelled_by = "Claude (synthetic draft), reviewed in part by Babu"
labelled_on = "2026-10-05"

# Controlled vocabularies. The loader rejects anything outside these lists so a
# typo in a label cannot silently pass or fail a case.
confidence_levels = ["HIGH", "MEDIUM", "LOW"]
priority_levels = ["IMMEDIATE", "HIGH", "MEDIUM", "LOW", "EXCLUDED"]
inferred_levels = [
  "EXECUTIVE",
  "VP_EQUIVALENT",
  "SENIOR_DIRECTOR_EQUIVALENT",
  "DIRECTOR_EQUIVALENT",
  "INDIVIDUAL_CONTRIBUTOR",
  "UNKNOWN",
]
