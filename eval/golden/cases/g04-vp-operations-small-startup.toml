Kitebright is a 40-person seed-stage startup looking for a VP of Operations. You will
manage our office, coordinate travel and events, run payroll with our outside
provider, handle vendor contracts for facilities, and supervise our three operations
coordinators.

You will be the go-to person for everything that keeps the office running. Five
years of operations or office management experience preferred. Onsite in Palo Alto
five days a week.
"""

