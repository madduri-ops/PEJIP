base_min_usd = 210_000
base_max_usd = 240_000
description = """
Pinecrest Commerce is looking for a Head of Customer Success Operations to own
renewal forecasting, customer health scoring, CRM administration and the tooling our
customer success managers use every day. You will lead a team of eight analysts and
report to the VP of Customer Success.

You have run customer success or revenue operations at a SaaS company, are fluent in
Salesforce and Gainsight, and have owned net revenue retention targets.

Hybrid in San Mateo. Base $210,000 to $240,000.
"""

